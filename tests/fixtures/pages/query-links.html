<!doctype html>
<!-- M4 fixture (§18 item 1, §7.8): anchor hrefs carrying PII-shaped values and
     sensitive query keys, for URL sanitization (path/query values run through
     §7.1-7.4; sensitive keys like token/session/email/phone redacted regardless
     of content). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Query links — canary fixture</title>
  </head>
  <body>
    <ul>
      <li>
        <a href="https://example.com/reset?email=priya.sharma.canary%40example.com" data-canary="email-personal"
          >Reset link (email param)</a
        >
      </li>
      <li>
        <a href="https://example.com/session?token=eyCanaryTok3n.abcDEF456" data-canary="query-token"
          >Session link (token param)</a
        >
      </li>
      <li>
        <a href="https://example.com/profile?phone=%2B919876543210" data-canary="phone">Profile link (phone param)</a>
      </li>
    </ul>
  </body>
</html>
