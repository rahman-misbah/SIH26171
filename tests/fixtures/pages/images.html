<!doctype html>
<!-- M4 fixture (§18 item 1, §6): <img> elements carrying canaries for the image
     pipeline: rendered PII text (OCR target, M9), synthetic faces (face
     detection target, M8 — procedurally generated, not photos of real people),
     and a QR code that genuinely decodes to a canary email (M9, zxing-wasm).
     M9: all 7 images on one page, more than the mock backend's 4-image
     request limit, so §14.3 selection and `request_limit` markers are
     exercised end to end. faces.html and images-text.html hold subsets that
     fit in one request, for the per-detector tests.

     M8 added face-3.png / face-4.png: photo-realistic *synthetic* faces
     (StyleGAN2 output from thispersondoesnotexist.com -- not real people),
     public domain as algorithm-generated works, downscaled to 330px from
     Wikimedia Commons: "File:GAN Mensch StyleGAN2.png" and
     "File:This Person Does Not Exist example.jpg". The flat cartoon faces
     are kept too: BlazeFace detects both kinds, and the realistic ones are
     the closer proxy for real sites. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Images — canary fixture</title>
  </head>
  <body>
    <img src="../assets/rendered-text.png" alt="" data-canary="rendered-text" width="560" height="120" />
    <img src="../assets/ocr-mixed.png" alt="" data-canary="ocr-mixed" width="520" height="200" />
    <img src="../assets/face-1.png" alt="" data-canary="face-1" width="200" height="200" />
    <img src="../assets/face-2.png" alt="" data-canary="face-2" width="200" height="200" />
    <img src="../assets/face-3.png" alt="" data-canary="face-3" width="200" height="200" />
    <img src="../assets/face-4.png" alt="" data-canary="face-4" width="200" height="200" />
    <img src="../assets/qr-1.png" alt="" data-canary="qr-1" width="300" height="300" />
  </body>
</html>
