<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Edward settings</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, system-ui, sans-serif;
        max-width: 480px;
        margin: 24px auto;
        padding: 0 16px;
      }
      fieldset {
        margin-bottom: 16px;
      }
      label {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: #444;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 4px 6px;
      }
      button {
        font: inherit;
        padding: 6px 16px;
        margin-top: 16px;
      }
      #status {
        margin-top: 8px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Edward settings</h1>

      <label for="backend">Reasoning backend</label>
      <select id="backend">
        <option value="mock">Mock (no network, records observations)</option>
        <option value="llm:groq">Groq</option>
        <option value="llm:openai-compatible">Self-hosted / OpenAI-compatible</option>
        <option value="http:custom">Custom agent server (Edward wire protocol)</option>
      </select>

      <fieldset id="groq-fields">
        <legend>Groq</legend>
        <label for="groq-key">API key</label>
        <input id="groq-key" type="password" autocomplete="off" />
        <label for="groq-model">Model (optional override)</label>
        <input id="groq-model" type="text" placeholder="qwen/qwen3.8-27b" />
      </fieldset>

      <fieldset id="oac-fields">
        <legend>Self-hosted / OpenAI-compatible</legend>
        <label for="oac-base-url">Base URL</label>
        <input id="oac-base-url" type="text" placeholder="https://your-server/v1" />
        <label for="oac-key">API key</label>
        <input id="oac-key" type="password" autocomplete="off" />
        <label for="oac-model">Model</label>
        <input id="oac-model" type="text" />
      </fieldset>

      <fieldset id="http-fields">
        <legend>Custom agent server</legend>
        <label for="http-endpoint">Endpoint (HTTPS, or http://localhost for development)</label>
        <input id="http-endpoint" type="text" placeholder="https://your-server/edward" />
        <label for="http-token">Bearer token (optional)</label>
        <input id="http-token" type="password" autocomplete="off" />
      </fieldset>

      <fieldset id="model-fields">
        <legend>On-device models</legend>
        <label for="face-model">Face detection</label>
        <select id="face-model">
          <option value="">Automatic (SCRFD on a GPU, BlazeFace otherwise)</option>
          <option value="face/scrfd-2.5g">SCRFD-2.5G (tier 2, better on small faces, slower without a GPU)</option>
          <option value="face/blazeface-mediapipe">BlazeFace (tier 1, fastest)</option>
        </select>
        <label>Model changes apply the next time Edward starts (reload the extension or restart the browser).</label>
      </fieldset>

      <button id="save" type="button">Save</button>
      <div id="status"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
