<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edward: what was sent</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #1b1f24;
        --muted: #5b6470;
        --line: #d9dde3;
        --token-bg: #e7efff;
        --token-ink: #1f4fbf;
        --secret-bg: #fde8e8;
        --secret-ink: #b42318;
        --marker: #8a6d00;
        --marker-bg: #fff8db;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 -apple-system, system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--ink);
        color: #fff;
        padding: 10px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 15px;
        margin: 0 8px 0 0;
      }
      header button {
        font: inherit;
        padding: 3px 10px;
      }
      #step-label {
        font-variant-numeric: tabular-nums;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 16px;
      }
      #input-panel textarea {
        width: 100%;
        height: 160px;
        font: 12px/1.4 ui-monospace, monospace;
        padding: 8px;
        border: 2px dashed var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      #input-panel.dragging textarea {
        border-color: var(--token-ink);
      }
      #input-panel p {
        color: var(--muted);
        margin: 6px 0;
      }
      #error {
        color: var(--secret-ink);
        font-weight: 600;
      }
      .summary {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 12px 0;
      }
      .summary dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 12px;
        margin: 0;
      }
      .summary dt {
        color: var(--muted);
      }
      .summary dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .page {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px 24px;
      }
      .page-caption {
        color: var(--muted);
        font-size: 12px;
        margin: 16px 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .node {
        margin: 2px 0;
      }
      .node.inline {
        display: inline;
      }
      .node.invisible {
        opacity: 0.45;
      }
      .node.h {
        font-weight: 700;
        margin: 10px 0 4px;
      }
      .node.h1 {
        font-size: 24px;
      }
      .node.h2 {
        font-size: 20px;
      }
      .node.h3 {
        font-size: 17px;
      }
      .node.list-item::before {
        content: '• ';
        color: var(--muted);
      }
      .node.link {
        color: #0b57d0;
        text-decoration: underline;
      }
      .control {
        display: inline-block;
        min-width: 180px;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 8px;
        margin: 2px 4px 2px 0;
        background: #fbfbfc;
      }
      .control .placeholder {
        color: var(--muted);
        font-style: italic;
      }
      .button {
        display: inline-block;
        border: 1px solid #9aa4b2;
        border-radius: 4px;
        padding: 2px 10px;
        margin: 2px 4px 2px 0;
        background: #eef1f5;
      }
      .kind {
        font: 10px ui-monospace, monospace;
        color: var(--muted);
        margin-right: 4px;
      }
      .token,
      .secret {
        font: 600 12px ui-monospace, monospace;
        border-radius: 4px;
        padding: 0 4px;
        white-space: nowrap;
      }
      .token {
        background: var(--token-bg);
        color: var(--token-ink);
      }
      .secret {
        background: var(--secret-bg);
        color: var(--secret-ink);
      }
      .marker,
      .omitted,
      .trimmed {
        display: block;
        border: 1px dashed var(--marker);
        background: var(--marker-bg);
        color: var(--marker);
        border-radius: 4px;
        padding: 4px 8px;
        margin: 4px 0;
        font-size: 12px;
      }
      figure.sent {
        display: inline-block;
        margin: 6px 8px 6px 0;
        border: 2px solid #1f883d;
        border-radius: 6px;
        padding: 4px;
        background: #fff;
        vertical-align: top;
      }
      figure.sent img {
        display: block;
        max-width: 100%;
        max-height: 420px;
      }
      figure.sent figcaption {
        font-size: 11px;
        color: #1f883d;
        margin-top: 2px;
      }
      .chips span {
        margin-right: 6px;
      }
      .history li {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Edward: what the backend received</h1>
      <button id="prev" hidden>◀</button>
      <span id="step-label"></span>
      <button id="next" hidden>▶</button>
      <button id="edit" hidden>New input</button>
    </header>
    <main>
      <section id="input-panel">
        <p>
          Paste a <strong>request body</strong> from the compute host's DevTools (Network → the
          <code>chat/completions</code> request → Payload → view source), drop a <strong>.har</strong> file
          exported from that Network tab, or paste a <strong>SanitizedObservation</strong>. Nothing leaves this page.
        </p>
        <textarea id="input" spellcheck="false" placeholder="Paste JSON here, or drop a .json / .har file"></textarea>
        <p><button id="render">Show</button> <span id="error"></span></p>
      </section>
      <section id="output" hidden></section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
